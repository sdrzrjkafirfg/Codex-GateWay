gateway:
  local_api_key_env: GATEWAY_API_KEY
  admin_api_key_env: GATEWAY_ADMIN_API_KEY
  request_timeout_seconds: 90
  connect_timeout_seconds: 10
  failure_threshold: 10
  cooldown_seconds: 60
  health_check_interval_seconds: 60
  health_check_model: gpt-5.4-mini
  recovery_check_interval_seconds: 20
  recovery_success_threshold: 2
  retry_status_codes: [408, 429, 500, 502, 503, 504]
  state_database_path: gateway-state.db

routing:
  mode: auto
  manual_strategy: priority_failover
  pinned_provider: null

providers:
  - name: relay-a
    base_url: https://relay-a.example/v1
    api_key_env: RELAY_A_API_KEY
    price_multiplier: 0.17
    priority: 1
    enabled: true
  - name: relay-b
    base_url: https://relay-b.example/v1
    api_key_env: RELAY_B_API_KEY
    price_multiplier: 0.20
    priority: 2
    enabled: true
  - name: relay-c
    base_url: https://relay-c.example/v1
    api_key_env: RELAY_C_API_KEY
    price_multiplier: 0.30
    priority: 3
    enabled: true
